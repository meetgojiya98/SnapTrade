name: Verify Balance
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: balance
          POSTGRES_PASSWORD: balance_test_only
          POSTGRES_DB: balance_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U balance -d balance_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://balance:balance_test_only@127.0.0.1:5432/balance_test_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:migrations
      - name: Select PostgreSQL recovery client tools
        shell: bash
        run: |
          task_pg_bin=''
          for task_pg_candidate in /usr/lib/postgresql/*/bin; do
            if [[ ! -x "$task_pg_candidate/pg_dump" || ! -x "$task_pg_candidate/pg_restore" ]]; then
              continue
            fi
            task_pg_version="$("$task_pg_candidate/pg_dump" --version)"
            if [[ "$task_pg_version" =~ PostgreSQL\)\ ([0-9]+) ]] && (( BASH_REMATCH[1] >= 17 )); then
              task_pg_bin="$task_pg_candidate"
              break
            fi
          done
          if [[ -z "$task_pg_bin" ]]; then
            # GitHub's Ubuntu images configure the official PostgreSQL Apt repository.
            # Their default client may be older than the PostgreSQL 17 service.
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql-client-17
            task_pg_bin='/usr/lib/postgresql/17/bin'
          fi
          printf '%s\n' "$task_pg_bin" >> "$GITHUB_PATH"
          "$task_pg_bin/pg_dump" --version
          "$task_pg_bin/pg_restore" --version
      - name: Rehearse isolated encrypted database recovery
        run: npm run test:recovery
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
